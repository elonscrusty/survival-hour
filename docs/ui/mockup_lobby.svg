<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" font-family="Trebuchet MS, Segoe UI, Arial, sans-serif">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b2140"/>
      <stop offset="0.45" stop-color="#8a4a3a"/>
      <stop offset="0.7" stop-color="#e59a52"/>
      <stop offset="1" stop-color="#3a2a1c"/>
    </linearGradient>
    <radialGradient id="fireGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffcf7a" stop-opacity="0.9"/>
      <stop offset="0.4" stop-color="#ff8a3a" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#ff6a1a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2e2620" stop-opacity="0.94"/>
      <stop offset="1" stop-color="#1a1512" stop-opacity="0.94"/>
    </linearGradient>
    <linearGradient id="ready" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f7b25a"/>
      <stop offset="1" stop-color="#c46a22"/>
    </linearGradient>
    <linearGradient id="xp" x1="0" x2="1">
      <stop offset="0" stop-color="#f5a046"/>
      <stop offset="1" stop-color="#ffd27a"/>
    </linearGradient>
    <linearGradient id="vignette" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#000" stop-opacity="0.35"/>
      <stop offset="0.3" stop-color="#000" stop-opacity="0"/>
      <stop offset="0.7" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity="0.6"/>
    </linearGradient>
    <g id="pine"><polygon points="0,-120 -34,-40 -18,-40 -46,20 -24,20 -58,80 58,80 24,20 46,20 18,-40 34,-40"/><rect x="-6" y="80" width="12" height="30"/></g>
  </defs>

  <!-- scene -->
  <rect width="1600" height="900" fill="url(#sky)"/>
  <circle cx="1180" cy="430" r="70" fill="#ffd79a" opacity="0.55"/>
  <g fill="#4a2e2a" opacity="0.7">
    <use href="#pine" transform="translate(80,520) scale(1.6)"/><use href="#pine" transform="translate(220,560) scale(1.3)"/>
    <use href="#pine" transform="translate(1320,540) scale(1.5)"/><use href="#pine" transform="translate(1480,510) scale(1.8)"/>
    <use href="#pine" transform="translate(980,590) scale(1.1)"/><use href="#pine" transform="translate(620,600) scale(1.0)"/>
  </g>
  <g fill="#23170f">
    <use href="#pine" transform="translate(30,640) scale(2.4)"/><use href="#pine" transform="translate(300,690) scale(2)"/>
    <use href="#pine" transform="translate(1250,680) scale(2.2)"/><use href="#pine" transform="translate(1560,650) scale(2.6)"/>
  </g>
  <rect y="760" width="1600" height="140" fill="#1b140e"/>
  <ellipse cx="800" cy="760" rx="420" ry="60" fill="#2a1f14"/>
  <circle cx="800" cy="700" r="220" fill="url(#fireGlow)"/>
  <g transform="translate(800,745)">
    <rect x="-60" y="0" width="120" height="14" rx="7" fill="#5a3a22" transform="rotate(12)"/>
    <rect x="-60" y="0" width="120" height="14" rx="7" fill="#6a4428" transform="rotate(-12)"/>
    <path d="M-30,0 C-40,-50 -5,-60 0,-110 C10,-70 40,-55 30,0 Z" fill="#ff8a2a"/>
    <path d="M-16,0 C-20,-35 0,-40 2,-72 C10,-45 24,-35 16,0 Z" fill="#ffd36a"/>
  </g>
  <rect width="1600" height="900" fill="url(#vignette)"/>

  <!-- top-left profile -->
  <g transform="translate(28,24)">
    <rect width="470" height="96" rx="16" fill="url(#panel)" stroke="#7a5f42" stroke-width="2"/>
    <circle cx="52" cy="48" r="34" fill="#3c2f24" stroke="#f5a046" stroke-width="4"/>
    <text x="52" y="44" text-anchor="middle" font-size="13" fill="#d9c8ad" font-weight="bold">LVL</text>
    <text x="52" y="66" text-anchor="middle" font-size="24" fill="#fff4dc" font-weight="bold">27</text>
    <text x="102" y="38" font-size="20" fill="#fff4dc" font-weight="bold">kcdrewcarter</text>
    <text x="102" y="58" font-size="14" fill="#f5b060" font-style="italic">"Woodwise"</text>
    <rect x="102" y="68" width="250" height="12" rx="6" fill="#120e0b"/>
    <rect x="102" y="68" width="168" height="12" rx="6" fill="url(#xp)"/>
    <text x="358" y="79" font-size="12" fill="#cbb89a">4,120 / 6,100 XP</text>
  </g>
