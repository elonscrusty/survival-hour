      <rect x="14" y="14" width="46" height="46" rx="10" fill="#6e8a4a"/><polygon points="37,22 52,52 22,52" fill="#1f2a14"/>
      <text x="76" y="36" font-size="22" fill="#fff4dc">CLASS</text><text x="76" y="58" font-size="15" fill="#c6d8a8">Scavenger</text>
    </g>
    <g transform="translate(0,88)">
      <rect width="300" height="74" rx="14" fill="url(#panel)" stroke="#7a5f42" stroke-width="2"/>
      <rect x="14" y="14" width="46" height="46" rx="10" fill="#b8573a"/><circle cx="37" cy="37" r="12" fill="#ffdd9a"/>
      <text x="76" y="36" font-size="22" fill="#fff4dc">POWER-UP</text><text x="76" y="58" font-size="15" fill="#f1b8a0">Firekeeper</text>
    </g>
    <g transform="translate(0,176)">
      <rect width="300" height="74" rx="14" fill="url(#panel)" stroke="#7a5f42" stroke-width="2"/>
      <rect x="14" y="14" width="46" height="46" rx="10" fill="#8a5aa8"/><rect x="26" y="22" width="22" height="30" rx="4" fill="#e8d4ff"/>
      <text x="76" y="36" font-size="22" fill="#fff4dc">LOCKER</text><text x="76" y="58" font-size="15" fill="#d8c0ea">Outfits, skins, emotes</text>
    </g>
    <g transform="translate(0,264)">
      <rect width="300" height="74" rx="14" fill="url(#panel)" stroke="#7a5f42" stroke-width="2"/>
      <rect x="14" y="14" width="46" height="46" rx="10" fill="#c79a2e"/><circle cx="37" cy="37" r="13" fill="#ffe28a" stroke="#8a6212" stroke-width="3"/>
      <text x="76" y="36" font-size="22" fill="#fff4dc">SHOP</text><text x="76" y="58" font-size="15" fill="#f0d898">Coin packs &amp; bundles</text>
      <rect x="226" y="10" width="60" height="22" rx="11" fill="#d8452e"/><text x="256" y="26" text-anchor="middle" font-size="13" fill="#fff">NEW</text>
    </g>
    <g transform="translate(0,352)">
      <rect width="300" height="74" rx="14" fill="url(#panel)" stroke="#7a5f42" stroke-width="2"/>
      <rect x="14" y="14" width="46" height="46" rx="10" fill="#4a7aa8"/><rect x="24" y="36" width="8" height="16" fill="#d8ecff"/><rect x="34" y="26" width="8" height="26" fill="#d8ecff"/><rect x="44" y="31" width="8" height="21" fill="#d8ecff"/>
      <text x="76" y="36" font-size="22" fill="#fff4dc">PROFILE</text><text x="76" y="58" font-size="15" fill="#b8d0ea">Rewards &amp; leaderboards</text>
      <circle cx="280" cy="18" r="9" fill="#f5a046"/>
    </g>
  </g>

  <!-- right: loadout card -->
  <g transform="translate(1212,250)">
    <rect width="360" height="300" rx="18" fill="url(#panel)" stroke="#7a5f42" stroke-width="2"/>
    <text x="24" y="42" font-size="15" fill="#cbb89a" letter-spacing="2">NEXT MATCH LOADOUT</text>
    <rect x="24" y="60" width="312" height="100" rx="12" fill="#221b15" stroke="#6e8a4a" stroke-width="2"/>
    <rect x="38" y="74" width="72" height="72" rx="12" fill="#6e8a4a"/><polygon points="74,86 96,132 52,132" fill="#1f2a14"/>
    <text x="124" y="98" font-size="22" font-weight="bold" fill="#fff4dc">Scavenger</text>
    <text x="124" y="120" font-size="14" fill="#c6d8a8">+30% search speed · +2 slots</text>
    <text x="124" y="140" font-size="14" fill="#c6d8a8">Senses nearby containers</text>
    <rect x="24" y="172" width="312" height="100" rx="12" fill="#221b15" stroke="#b8573a" stroke-width="2"/>
    <rect x="38" y="186" width="72" height="72" rx="12" fill="#b8573a"/><circle cx="74" cy="222" r="20" fill="#ffdd9a"/>
    <text x="124" y="210" font-size="22" font-weight="bold" fill="#fff4dc">Firekeeper</text>
    <text x="124" y="232" font-size="14" fill="#f1b8a0">Wood adds 20% more fuel</text>
    <text x="124" y="252" font-size="14" fill="#a89478">Locked once the match starts</text>
  </g>
  <!-- daily reward -->
  <g transform="translate(1212,570)">
    <rect width="360" height="80" rx="16" fill="url(#panel)" stroke="#f5a046" stroke-width="2"/>
    <text x="24" y="34" font-size="18" font-weight="bold" fill="#fff4dc">Daily bonus · Day 4</text>
    <text x="24" y="58" font-size="14" fill="#cbb89a">Streak keeps growing to 150</text>
    <rect x="228" y="18" width="116" height="44" rx="12" fill="#4f8a3a"/>
    <text x="286" y="47" text-anchor="middle" font-size="18" font-weight="bold" fill="#fff">+110</text>
  </g>

  <!-- ready button -->
  <g transform="translate(560,790)">
    <rect x="6" y="8" width="480" height="84" rx="20" fill="#000" opacity="0.4"/>
    <rect width="480" height="84" rx="20" fill="url(#ready)" stroke="#ffe0a8" stroke-width="3"/>
    <text x="240" y="56" text-anchor="middle" font-size="40" font-weight="900" fill="#3a1a06" letter-spacing="4">READY UP</text>
  </g>
  <text x="800" y="780" text-anchor="middle" font-size="16" fill="#ffe8c8">3 / 4 survivors searching · or step into the glowing ring</text>
</svg>
