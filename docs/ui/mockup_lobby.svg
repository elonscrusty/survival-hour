    <circle cx="30" cy="27" r="15" fill="#f2c14e" stroke="#a87a1e" stroke-width="3"/><text x="30" y="33" text-anchor="middle" font-size="15" font-weight="bold" fill="#7a5410">C</text>
    <text x="56" y="35" font-size="22" font-weight="bold" fill="#ffe7b0">12,450</text>
    <circle cx="170" cy="27" r="13" fill="#5a8a3a"/><text x="170" y="33" text-anchor="middle" font-size="18" font-weight="bold" fill="#fff">+</text>
  </g>
  <g transform="translate(1384,24)">
    <rect width="190" height="54" rx="27" fill="url(#panel)" stroke="#7a5f42" stroke-width="2"/>
    <polygon points="30,12 44,27 30,42 16,27" fill="#7ee0ff" stroke="#2b8fb0" stroke-width="3"/>
    <text x="56" y="35" font-size="22" font-weight="bold" fill="#bff1ff">86</text>
    <text x="100" y="34" font-size="13" fill="#9fb8c0">Diamonds</text>
  </g>

  <!-- title -->
  <text x="800" y="170" text-anchor="middle" font-size="96" font-weight="900" fill="#1a120c" opacity="0.6" letter-spacing="6">SURVIVAL HOUR</text>
  <text x="800" y="164" text-anchor="middle" font-size="96" font-weight="900" fill="#ffb95e" letter-spacing="6" stroke="#5a2a0e" stroke-width="3">SURVIVAL HOUR</text>
  <text x="800" y="206" text-anchor="middle" font-size="22" fill="#ffe8c8" letter-spacing="3">KEEP YOUR FIRE BURNING. OUTLAST EVERYONE.</text>

